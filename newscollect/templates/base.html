<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<script>try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){}
try{var p=localStorage.getItem("pane");document.documentElement.dataset.pane=(innerWidth<900||p==="closed")?"closed":"open"}catch(e){document.documentElement.dataset.pane=innerWidth<900?"closed":"open"}</script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body data-page="{% block page %}list{% endblock %}" data-section="{{ section or 'incident' }}">
<header>
  {% block pane_toggle %}{% endblock %}
  <a class="brand" href="/">{{ title }}</a>
  {% block header_nav %}{% endblock %}
  <form class="search" action="/" method="get" role="search">
    <input type="search" name="q" value="{{ q or '' }}" placeholder="{% if section == 'intel' %}인텔·권고 검색 (제품, CVE, 공격 그룹, 키워드){% else %}사고 검색 (기업, 공격자, 키워드){% endif %}" maxlength="100" aria-label="{% if section == 'intel' %}인텔·권고 검색{% else %}사고 검색{% endif %}">
    {% if section == "intel" %}<input type="hidden" name="section" value="intel">{% endif %}
    {% if tab and tab != "all" %}<input type="hidden" name="tab" value="{{ tab }}">{% endif %}
    <button type="submit">검색</button>
  </form>
  <div class="themes" role="group" aria-label="테마 선택">
    <button type="button" data-theme-choice="light" aria-pressed="false">☀ 라이트</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">🌙 다크</button>
  </div>
</header>
<div class="layout">
{% block side %}{% endblock %}
<main>{% block content %}{% endblock %}</main>
</div>
<footer>보안뉴스·데일리시큐 등 RSS 기사를 AI가 요약했습니다. 정확한 내용은 원문을 확인하세요.</footer>
<script src="{{ static_url('app.js') }}"></script>
</body>
</html>
