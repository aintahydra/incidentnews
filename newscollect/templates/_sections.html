{% set hq = ("q=" ~ (q|urlencode) ~ "&amp;") if q else "" %}
<nav class="sections" aria-label="정보 종류">
  {% for key, label in [("incident", "보안 사고"), ("intel", "인텔·권고")] %}
  <a href="/?{{ hq }}section={{ key }}"{% if section == key %} aria-current="page"{% endif %}>{{ label }} <span class="count">{{ section_counts[key] }}</span></a>
  {% endfor %}
  <a href="/?section=graph"{% if section == "graph" %} aria-current="page"{% endif %} title="같은 글타래에 함께 붙는 태그의 연결망">태그간 관계 그래프</a>
</nav>
