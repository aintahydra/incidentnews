# newscollect configuration. Re-read on every collection cycle:
# add, delete or edit [[sources]] / [llm] and it applies without a restart.

[server]
host = "0.0.0.0"
port = 8000
site_title = "최신 보안사고 목록"
# How often (seconds) an open list page checks for new incidents and shows them without a reload.
# 0 turns auto-refresh off; values below 5 are raised to 5. Applies on the next page load.
#refresh_seconds = 60
refresh_seconds = 600

[llm]
enabled = true
# Which LLM writes the extractions and summaries (applies on the next collection cycle, no restart):
#   "local"  - Ollama at `endpoint` with `model` / `foreign_model` below
#   "claude" - Anthropic API; key from ANTHROPIC_API_KEY (.env is loaded at startup); uses `claude_model` for all articles
provider = "local"
#provider = "claude"
claude_model = "claude-sonnet-5-5"
# How much Claude thinks before answering: low | medium | high | xhigh | max. Higher = better but slower and costlier.
claude_effort = "low"

# --- local (Ollama) settings ---
# OLLAMA_HOST env var (e.g. 10.0.2.2:11434) overrides this endpoint.
endpoint = "127.0.0.1:11434"
#model = "solar:10.7b"
model = "gemma4:31b"
# Model for non-Korean (e.g. English) articles. solar writes garbled Korean from English text;
# exaone3.5 gives clean Korean. Remove this line to use `model` for everything.
#foreign_model = "exaone3.5:7.8b"
foreign_model = "gemma4:31b"
timeout_seconds = 180
# Context window sent to Ollama. Its default (4096) is too small for long Korean articles
# (~1.1 tokens per character) and silently truncates the prompt.
num_ctx = 8192
# Thinking models (gemma4, qwen3, ...) reason before answering. That is slow, and the reasoning counts toward
# the reply length limit, so answers came back empty or cut off. Leave false unless you raise the limits.
think = false

[collector]
interval_minutes = 30
max_articles_per_run = 30   # per source, newest first
max_age_days = 30           # ignore older feed items
database = "data/news.db"

[tagcloud]
# Tags left out of the tag cloud because they are too common to be informative. Whole tags only, case-insensitive:
# "해킹" removes the tag #해킹 but keeps #금융권해킹. Applies on the next page load (no restart).
# Tags are still shown on the cards and stay searchable.
exclude = ["공격", "해킹", "사이버", "해커", "보안", "유출", "개인정보", "감염"]

[orgs]
# Incidents whose victim is on these lists get a tag and show up in the "정부공공" tab.
# government_list: name in the 2nd column -> "정부기관"; public_list: name in the 1st column -> "공공기관".
# Names match after dropping "(...)" parts (e.g. "(재)"), 재단법인/주식회사 and spaces; a victim containing a listed name
# also matches ("국민건강보험공단 일산병원"). Local governments also match their short forms (서울시, 종로구청).
# Replace a file with a newer list and it applies on the next page load. UTF-8 (EUC-KR also accepted).
government_list = "refs/국가데이터처_KOSIS 기관목록테이블_20251107.csv"
public_list = "refs/재정경제부_공공기관 지정현황_20260617.csv"

