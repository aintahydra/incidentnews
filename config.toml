# ---- Intel & advisories (the "인텔·권고" tab) ----
# Same fields as [[sources]]. Every article becomes one Korean entry (kind: 권고 / 위협 분석 / 가이드 / 정책) with a
# summary, a recommended action and up to four tags (actor, product/CVE, technique, topic). Not-security posts
# (webinar promos, hiring, marketing) are skipped by the LLM.

