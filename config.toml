# newscollect configuration. Re-read on every collection cycle:
# add, delete or edit [[sources]] / [llm] and it applies without a restart.

[server]
host = "0.0.0.0"
port = 8000
site_title = "최신 보안사고 목록"

[llm]
enabled = true
# OLLAMA_HOST env var (e.g. 10.0.2.2:11434) overrides this endpoint.
endpoint = "127.0.0.1:11434"
model = "solar:10.7b"
# Model for non-Korean (e.g. English) articles. solar writes garbled Korean from English text;
# exaone3.5 gives clean Korean. Remove this line to use `model` for everything.
foreign_model = "exaone3.5:7.8b"
timeout_seconds = 180
# Context window sent to Ollama. Its default (4096) is too small for long Korean articles
# (~1.1 tokens per character) and silently truncates the prompt.
num_ctx = 8192

[collector]
interval_minutes = 30
max_articles_per_run = 30   # per source, newest first
max_age_days = 30           # ignore older feed items
database = "data/news.db"

[wordcloud]
# Keywords too common to be informative. Each is removed from INSIDE every title word, so a compound keeps
# its informative part: "금융권해킹" -> "금융권", while "사이버공격" -> "" is dropped. Case-insensitive.
# Applies on the next page load (no restart). Victim/attacker names are never cut, only dropped when
# they consist solely of these keywords. Beware short keys that occur inside names ("보안" would turn
# "금융보안원" into "금융원").
trivial = ["공격", "해킹", "사이버", "해커", "보안", "유출", "개인정보"]

[[sources]]
name = "보안뉴스"
url = "https://www.boannews.com/rss/S1N2.xml"
enabled = true

[[sources]]
name = "데일리시큐"
url = "https://www.dailysecu.com/rss/S1N2.xml"
enabled = true

[[sources]]
name = "Bleeping Computer"
url = "https://www.bleepingcomputer.com/feed/"
enabled = true

[[sources]]
name = "The Hacker News"
url = "https://feeds.feedburner.com/TheHackersNews"
enabled = true
